name: Cookie
options:
  bundleIdPrefix: com.cookie
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_SWIFT_FLAGS: "-Xfrontend -disable-sandbox"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  Cookie:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Cookie
        excludes:
          - "Resources/Info.plist"
          - "Resources/Sprites"
          - "Resources/Sounds"
      - path: Cookie/Resources/Sprites
        type: folder
      - path: Cookie/Resources/Sounds
        type: folder
        buildPhase: resources
      - path: Cookie/Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: Cookie/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cookie
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "© 2026 Md Kasif Uddin. All rights reserved."
        LSApplicationCategoryType: public.app-category.entertainment
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cookie.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: "NO"
        COMBINE_HIDPI_IMAGES: "YES"

  CookieTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CookieTests
    dependencies:
      - target: Cookie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cookie.mac.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: "NO"

schemes:
  Cookie:
    build:
      targets:
        Cookie: all
        CookieTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CookieTests
