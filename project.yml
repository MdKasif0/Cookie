name: Cookie
options:
  bundleIdPrefix: com.cookie
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Cookie:
    type: application
    platform: macOS
    sources:
      - path: Cookie
        excludes:
          - "Resources/Info.plist"
          - "Resources/Sprites"
          - "Resources/Sounds"
      - path: Cookie/Resources/Sprites
        type: folder
      - path: Cookie/Resources/Sounds
        type: folder
        buildPhase: resources
    info:
      path: Cookie/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cookie
        LSApplicationCategoryType: public.app-category.entertainment
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cookie.mac
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: "NO"
        COMBINE_HIDPI_IMAGES: "YES"

schemes:
  Cookie:
    build:
      targets:
        Cookie: all
    run:
      config: Debug
