name: Build Cookie for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Pushing a tag such as windows-v1.2.0 also publishes the build to GitHub Releases.
    # Plain v* tags are Mac releases and must not start a Windows release.
    tags:
      - 'windows-v*'

jobs:
  build:
    name: Build & Package Windows Installer
    runs-on: windows-latest
    permissions:
      # Only used to publish a release when a version tag is pushed.
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      # Signing runs only when its secrets exist. See DISTRIBUTION.md.
      SIGN_WITH_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
      SIGN_WITH_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Cookie.Windows.sln

      - name: Run Tests
        run: dotnet test Cookie.Windows.Tests/Cookie.Windows.Tests.csproj -c Release --no-restore

      - name: Publish Self-Contained win-x64 Application
        run: dotnet publish Cookie.Windows/Cookie.Windows.csproj -c Release -r win-x64 --self-contained true -o dist/windows/win-x64

      - name: Verify Required Assets
        run: |
          $required = @(
            "dist/windows/win-x64/Cookie.exe",
            "dist/windows/win-x64/Resources/Cookie.ico",
            "dist/windows/win-x64/Resources/AssetManifest.json",
            "dist/windows/win-x64/Resources/Sounds/cookie-meow.wav",
            "dist/windows/win-x64/Resources/Sounds/cookie-purr.wav",
            "dist/windows/win-x64/Resources/Sounds/cookie-welcome.wav",
            "dist/windows/win-x64/Resources/Sprites/Cookie/Emotes/Happy/happy.png",
            "dist/windows/win-x64/Resources/Sprites/Cookie/Emotes/Love/love.png",
            "dist/windows/win-x64/Resources/Sprites/Cookie/Emotes/Wave/wave.png",
            "dist/windows/win-x64/Resources/Sprites/Cookie/Emotes/Sleepy/sleepy.png",
            "dist/windows/win-x64/Resources/Sprites/Cookie/Emotes/Playful/playful.png",
            "dist/windows/win-x64/Resources/Sprites/Cookie/Idle/idle.png",
            "dist/windows/win-x64/Resources/Sprites/Cookie/Walk/walk.png",
            "dist/windows/win-x64/Resources/Sprites/Cookie/Sleep/sleep.png",
            "dist/windows/win-x64/Resources/CookieTray.ico",
            "dist/windows/win-x64/Resources/Sprites/Cookie/Items/yarnBall.png",
            "dist/windows/win-x64/Resources/Sprites/Cookie/Accessories/hat.png",
            "dist/windows/win-x64/Resources/Sprites/Cookie/Icons/glyph-paw.png"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing required asset: $file"
              exit 1
            }
          }
          Write-Host "All required assets verified successfully."

      - name: Sign Application Binaries (Azure Artifact Signing)
        if: env.SIGN_WITH_AZURE == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\dist\windows\win-x64\Cookie.exe
            ${{ github.workspace }}\dist\windows\win-x64\Cookie.dll
            ${{ github.workspace }}\dist\windows\win-x64\Cookie.Windows.Core.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign Application Binaries (PFX)
        if: env.SIGN_WITH_PFX == 'true' && env.SIGN_WITH_AZURE != 'true'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          ./Packaging/windows/sign.ps1 -Files dist/windows/win-x64/Cookie.exe,dist/windows/win-x64/Cookie.dll,dist/windows/win-x64/Cookie.Windows.Core.dll

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Compile Inno Setup Installer
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows/installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Packaging/windows/CookieSetup.iss
          Copy-Item dist/windows/installer/CookieSetup-1.1.0.exe dist/windows/installer/Cookie-Setup.exe -Force
          Write-Host "Inno Setup installer compiled successfully."

      - name: Sign Installer (Azure Artifact Signing)
        if: env.SIGN_WITH_AZURE == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\dist\windows\installer\Cookie-Setup.exe
            ${{ github.workspace }}\dist\windows\installer\CookieSetup-1.1.0.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign Installer (PFX)
        if: env.SIGN_WITH_PFX == 'true' && env.SIGN_WITH_AZURE != 'true'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          ./Packaging/windows/sign.ps1 -Files dist/windows/installer/Cookie-Setup.exe,dist/windows/installer/CookieSetup-1.1.0.exe

      - name: Package Portable Zip
        run: |
          Compress-Archive -Path dist/windows/win-x64/* -DestinationPath dist/windows/Cookie-Windows-1.1.0-win-x64-Portable.zip -Force
          Write-Host "Portable zip packaged successfully."

      - name: Compute Checksums
        run: |
          $installerHash = (Get-FileHash -Algorithm SHA256 dist/windows/installer/Cookie-Setup.exe).Hash.ToLower()
          $zipHash = (Get-FileHash -Algorithm SHA256 dist/windows/Cookie-Windows-1.1.0-win-x64-Portable.zip).Hash.ToLower()
          $exeHash = (Get-FileHash -Algorithm SHA256 dist/windows/win-x64/Cookie.exe).Hash.ToLower()
          "$installerHash  dist/windows/installer/Cookie-Setup.exe" | Out-File -FilePath dist/windows/SHA256SUMS.txt -Encoding utf8
          "$zipHash  dist/windows/Cookie-Windows-1.1.0-win-x64-Portable.zip" | Out-File -FilePath dist/windows/SHA256SUMS.txt -Append -Encoding utf8
          "$exeHash  dist/windows/win-x64/Cookie.exe" | Out-File -FilePath dist/windows/SHA256SUMS.txt -Append -Encoding utf8
          Get-Content dist/windows/SHA256SUMS.txt

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cookie-Windows-Installer
          path: |
            dist/windows/installer/Cookie-Setup.exe
            dist/windows/installer/CookieSetup-1.1.0.exe
            dist/windows/Cookie-Windows-1.1.0-win-x64-Portable.zip
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error

      # Everything below runs only for Windows release tags (for example windows-v1.2.0).

      - name: Create and sign the update manifest
        if: startsWith(github.ref, 'refs/tags/windows-v')
        env:
          COOKIE_UPDATE_SIGNING_KEY: ${{ secrets.WINDOWS_UPDATE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:COOKIE_UPDATE_SIGNING_KEY) {
            Write-Error "The WINDOWS_UPDATE_SIGNING_KEY secret is not set. Refusing to publish an update feed that installed apps would reject. See DISTRIBUTION.md."
            exit 1
          }
          $version = $env:TAG -replace '^windows-v', ''
          $notes = "release-notes/windows-$version.md"
          if (-not (Test-Path $notes)) {
            Write-Error "Missing $notes. Write the release notes before tagging."
            exit 1
          }
          $url = "https://github.com/${{ github.repository }}/releases/download/$($env:TAG)/Cookie-Setup.exe"

          dotnet run --project Tools/CookieUpdateTool -c Release -- manifest --version $version --installer dist/windows/installer/Cookie-Setup.exe --url $url --notes-file $notes --out dist/windows/windows-update.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Exits non-zero if the key is not one the app trusts, so a wrong secret fails here.
          dotnet run --project Tools/CookieUpdateTool -c Release -- sign dist/windows/windows-update.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet run --project Tools/CookieUpdateTool -c Release -- verify dist/windows/windows-update.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^windows-v', ''
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            # The newest Windows release is "latest": the website's Windows download and the update
            # feed follow releases/latest. Mac releases are created with --latest=false.
            gh release create $env:TAG --title "Cookie for Windows $version" --notes-file "release-notes/windows-$version.md" --verify-tag --latest
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

          $zip = (Get-ChildItem dist/windows/Cookie-Windows-*-win-x64-Portable.zip).FullName
          gh release upload $env:TAG dist/windows/installer/Cookie-Setup.exe $zip dist/windows/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # The update feed goes last, so installed apps never see a manifest whose installer is not there yet.
          gh release upload $env:TAG dist/windows/windows-update.json dist/windows/windows-update.json.sig --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
