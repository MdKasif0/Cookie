# Netlify Configuration for the Cookie website
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/
#
# Downloads are published to GitHub Releases, not stored in this repository, so there is
# nothing to build: the site is static files. Redirects to the downloads are in website/_redirects.

[build]
  # Directory that contains the deploy-ready HTML files and assets
  publish = "website"

# Global security headers & HTML revalidation
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-term immutable caching for static image & font assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Revalidate stylesheets and scripts so updates apply immediately
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
