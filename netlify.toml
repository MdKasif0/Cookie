# Netlify Configuration for Cookie macOS Companion Website
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory that contains the deploy-ready HTML files and assets
  publish = "website"
  # Build command (ensures downloads/ is populated even if built on Netlify CI)
  command = "mkdir -p website/downloads && cp -f dist/Cookie-1.1.0.dmg website/downloads/Cookie-1.1.0.dmg || true && cp -f dist/windows/Cookie-Windows-1.1.0-win-x64-Portable.zip website/downloads/Cookie-Windows-1.1.0-win-x64-Portable.zip || true"

# Global security headers & HTML revalidation
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-term immutable caching for static image & font assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Download caching for releases
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Revalidate stylesheets and scripts so updates apply immediately
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Convenient redirects
[[redirects]]
  from = "/download/windows"
  to = "/downloads/Cookie-Windows-1.1.0-win-x64-Portable.zip"
  status = 302
  force = true

[[redirects]]
  from = "/download/mac"
  to = "/downloads/Cookie-1.1.0.dmg"
  status = 302
  force = true

[[redirects]]
  from = "/download"
  to = "/downloads/Cookie-1.1.0.dmg"
  status = 302
  force = true

[[redirects]]
  from = "/dist/*"
  to = "/downloads/:splat"
  status = 301
